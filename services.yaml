send_command:
  target:
    entity:
      integration: mpc_hc
      domain: media_player
  fields:
    command:
      required: true
      example: 956
      selector:
        number:
          min: 0
          max: 65535
          mode: box

set_tmdb_id:
  target:
    entity:
      integration: mpc_hc
      domain: media_player
  fields:
    tmdb_id:
      required: false
      example: 1234
      selector:
        number:
          min: 1
          max: 99999999
          mode: box
    media_type:
      required: false
      example: tv
      selector:
        select:
          options:
            - tv
            - movie
          translation_key: media_type
    scope:
      required: false
      default: series
      selector:
        select:
          options:
            - series
            - file
          translation_key: scope
