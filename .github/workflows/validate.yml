name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage integration under custom_components/mpc_hc
        run: |
          mkdir -p custom_components/mpc_hc
          for item in *; do
            case "$item" in
              custom_components|docs|scripts) continue ;;
              *) mv "$item" custom_components/mpc_hc/ ;;
            esac
          done
      - uses: home-assistant/actions/hassfest@master

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
